# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name conduit.colinshirley.com;
    return 301 https://$server_name$request_uri;
}

# HTTPS — terminates TLS, proxies to Go server on 8080
server {
    listen 443 ssl;
    server_name conduit.colinshirley.com;

    ssl_certificate     /etc/letsencrypt/live/conduit.colinshirley.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/conduit.colinshirley.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass         http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
